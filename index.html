<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wirtschaftsschule Gunzenhausen</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Familjen+Grotesk:wght@400;600&display=swap">
<style>
:root{--bg:#EDF0EC;--surface:#fff;--ink:#1B2420;--muted:#56635B;--line:#D3D9D3;--accent:#2C8A44;--accent-ink:#fff;--err:#B3261E;--glas:#3F6F7B}
@media (prefers-color-scheme:dark){:root{--bg:#111714;--surface:#19211D;--ink:#E6ECE7;--muted:#9BA9A0;--line:#2B3530;--accent:#4DB566;--accent-ink:#0E1511;--err:#F2B8B5;color-scheme:dark}}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
.card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;display:grid;gap:14px;box-sizing:border-box}
.band{height:12px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--accent) 0 3px,var(--glas) 3px 30px)}
h1{font-family:"Bricolage Grotesque","Avenir Next",sans-serif;font-size:1.9rem;line-height:1.05;margin:0;text-wrap:balance}
p{margin:0;color:var(--muted);line-height:1.5}
label{font-weight:600;font-size:.92rem}
input[type=password]{font:inherit;font-size:1.05rem;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}
button{font:inherit;font-weight:600;font-size:1rem;padding:12px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.msg{min-height:1.3em;font-size:.9rem;color:var(--err)}
</style></head><body>
<form class="card" id="f">
  <div class="band" aria-hidden="true"></div>
  <h1>Wirtschaftsschule Gunzenhausen</h1>
  <p>3D-Modell und 360°-Rundgang durchs Schulhaus. Bitte das Passwort aus dem Unterricht eingeben.</p>
  <label for="pw">Passwort</label>
  <input type="password" id="pw" autocomplete="current-password" required>
  <div class="row"><input type="checkbox" id="keep"><label for="keep" style="font-weight:400">Auf diesem Gerät merken</label></div>
  <button id="go" type="submit">Öffnen</button>
  <div class="msg" id="msg" role="alert"></div>
</form>
<script>
const M = {"salt": "fd2a2f8808167d0c04e4268cab76b7f1", "iv": "d13ef63efb12d598c24ed77f", "it": 250000, "file": "schulhaus.bin"};
const hex = h => new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
const msg = document.getElementById('msg'), btn = document.getElementById('go');
let dataP = null;
const getData = () => dataP ||= fetch(M.file).then(r => { if(!r.ok) throw new Error('load'); return r.arrayBuffer(); });
async function open(pw, remember){
  btn.disabled = true; btn.textContent = 'Wird geöffnet …'; msg.textContent = '';
  try{
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:hex(M.salt), iterations:M.it, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const ct = await getData();
    let plain;
    try { plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:hex(M.iv)}, key, ct); }
    catch { throw new Error('pw'); }
    const html = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    try { remember ? localStorage.setItem('schulhaus-pw2', pw) : localStorage.removeItem('schulhaus-pw2'); } catch {}
    document.open(); document.write(html); document.close();
  } catch(e){
    btn.disabled = false; btn.textContent = 'Öffnen';
    msg.textContent = e.message === 'pw' ? 'Das Passwort stimmt nicht. Bitte noch einmal versuchen.' : 'Die Seite konnte nicht geladen werden. Bitte Internetverbindung prüfen und neu laden.';
    try { localStorage.removeItem('schulhaus-pw2'); } catch {}
  }
}
document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); open(document.getElementById('pw').value, document.getElementById('keep').checked); });
let saved = null; try { saved = localStorage.getItem('schulhaus-pw2'); } catch {}
if (saved) { document.getElementById('keep').checked = true; open(saved, true); }
</script>
</body></html>
